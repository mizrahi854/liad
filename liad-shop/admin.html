<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIAD | מערכת ניהול</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin">

<!-- ==========================================================================
     סרגל עליון — קבוע בכל המסכים
     ========================================================================== -->
<div class="admin__bar">
  <div class="admin__bar-side">
    <a class="admin__logo" href="admin.html" aria-label="מערכת הניהול של LIAD">
      <img src="assets/liad-logo.png" alt="LIAD" width="200" height="52">
    </a>
    <nav class="admin__crumbs" id="crumbs" aria-label="מיקום במערכת"></nav>
  </div>

  <div class="admin__bar-side">
    <a class="btn btn--outline btn--sm" href="index.html" target="_blank" rel="noopener">צפייה בחנות</a>
    <a class="btn btn--outline btn--sm" href="../liad-landing/index.html" target="_blank" rel="noopener">צפייה בדף הבית</a>
  </div>
</div>


<!-- ==========================================================================
     מסך הבחירה הראשי
     ========================================================================== -->
<main id="screenHome" class="container">
  <div class="admin-home">
    <p class="eyebrow">מערכת ניהול</p>
    <h1 class="admin-home__title">מה נעדכן היום?</h1>
    <p class="admin-home__lead">כל שינוי שתשמרי כאן מופיע באתר מיד. אין צורך בידע טכני.</p>

    <div class="admin-home__grid">
      <button class="admin-choice" type="button" data-goto="shop">
        <span class="admin-choice__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 10a4 4 0 0 1-8 0"/><path d="M3.1 6h17.8"/>
            <path d="M3.4 5.5a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.7a2 2 0 0 0-.4-1.2l-2-2.7A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/>
          </svg>
        </span>
        <span class="admin-choice__title">ניהול החנות</span>
        <span class="admin-choice__text">מוצרים, מלאי, גוונים, קטגוריות, קופונים, הזמנות ורשימת הלקוחות.</span>
        <span class="admin-choice__list">
          <span>מוצרים</span><span>מלאי</span><span>גוונים</span><span>קטגוריות</span>
          <span>קופונים</span><span>הזמנות</span><span>לידים</span>
        </span>
      </button>

      <button class="admin-choice" type="button" data-goto="home">
        <span class="admin-choice__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
            <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
        </span>
        <span class="admin-choice__title">ניהול דף הבית</span>
        <span class="admin-choice__text">טקסטים, תמונות, סדר הסקשנים, המוצרים המוצגים, הבאנרים וההודעות הקופצות.</span>
        <span class="admin-choice__list">
          <span>טקסטים</span><span>תמונות</span><span>סדר סקשנים</span>
          <span>מוצרים מוצגים</span><span>באנרים</span><span>פופאפים</span>
        </span>
      </button>
    </div>

    <div class="notice" style="margin-top:2.5rem;text-align:start">
      <strong>איך זה עובד:</strong>
      השינויים נשמרים בדפדפן הזה ומופיעים באתר מיד. כדי שהם יופיעו גם אצל
      הלקוחות — לחצי על <strong>פרסום</strong> בסוף כל מסך, והעלי את הקובץ שיורד לשרת.
      <button class="btn btn--outline btn--sm" id="openBackup" style="margin-top:.75rem">גיבוי ושחזור</button>
    </div>
  </div>
</main>


<!-- ==========================================================================
     מסך עבודה — ניווט צד + אזור התוכן. נבנה ב-js/admin.js
     ========================================================================== -->
<main id="screenWork" class="admin__body" hidden>
  <nav class="admin-nav" id="adminNav" aria-label="אזורי ניהול"></nav>
  <div class="admin__main" id="adminMain"></div>
</main>


<!-- מודאל כללי — טפסי עריכה נטענים לתוכו -->
<div class="admin-modal" id="adminModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="admin-modal__card">
    <div class="admin-modal__head">
      <h2 class="admin-modal__title" id="modalTitle"></h2>
      <button class="admin-modal__close" id="modalClose" type="button" aria-label="סגירה">&times;</button>
    </div>
    <div id="modalBody"></div>
    <div class="admin-modal__foot" id="modalFoot"></div>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
